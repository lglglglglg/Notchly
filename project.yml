name: Notchly
options:
  bundleIdPrefix: com.notchly
  deploymentTarget:
    macOS: '14.0'
packages:
  MediaRemoteAdapter:
    path: Vendor/MediaRemoteAdapter
targets:
  Notchly:
    type: application
    platform: macOS
    sources:
      - Sources/Notchly
      - Notchly/Assets.xcassets
      - path: Notchly/THIRD_PARTY_NOTICES.txt
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
      - path: PRIVACY.md
        buildPhase: resources
    dependencies:
      - package: MediaRemoteAdapter
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notchly.app
        PRODUCT_NAME: Notchly
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Notchly/Info.plist
        CODE_SIGN_ENTITLEMENTS: Notchly/Notchly.entitlements
        SWIFT_VERSION: '6.0'
        MARKETING_VERSION: '0.13.9'
        CURRENT_PROJECT_VERSION: '64'
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
  NotchlyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/NotchlyTests
    dependencies:
      - target: Notchly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notchly.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '6.0'
schemes:
  Notchly:
    build:
      targets:
        Notchly: all
    test:
      targets:
        - name: NotchlyTests
